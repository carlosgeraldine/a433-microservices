# Using Docker Compose version 3
name: Docker Image CI for GHCR

services:
  # Service for the Node.js application
  item-app:
    # Use the image from GitHub Packages
    image: ghcr.io/$GITHUB_USERNAME/item-app:v1
    # Map container port 8080 to host port 80
    ports:
      - "80:8080"
    # Ensure item-app starts only after item-db is running
    depends_on:
      item-db:
        condition: service_healthy
    # Restart policy: always restart the container if it stops
    restart: always

  # Service for the MongoDB database
  item-db:
    # Use MongoDB version 3 from Docker Hub
    image: mongo:3
    # Mount volume for data persistence
    volumes:
    - app-db:/data/db
    healthcheck:
      test: ["CMD", "mongo", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Restart policy: always restart the container if it stops
    restart: always

# Define named volume for database persistence
volumes:
  app-db:
    # The volume will be created by Docker